<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A quiet place to track your cards, what you owe, and when you'll be clear.">
<title>Ledger</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F1F0EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #F1F0EB;
    --surface: #FFFFFF;
    --ink: #1C1E1B;
    --muted: #6E7168;
    --faint: #9A9C93;
    --line: #DEDCD1;
    --accent: #3F5D4E;
    --accent-soft: #E4EAE5;
    --danger: #8C3B2E;
    --warn: #A9762C;
    --warn-soft: #F3E9D8;
    --radius: 3px;
    --tabh: 62px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }
  #app { max-width: 460px; margin: 0 auto; min-height: 100vh; }

  .topbar {
    padding: calc(22px + env(safe-area-inset-top, 0px)) 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 26px; font-weight: 400; margin: 0; letter-spacing: 0.2px;
  }
  .topbar .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .sync { font-size: 11.5px; color: var(--faint); margin-top: 6px; min-height: 14px; }
  .sync.warn { color: var(--warn); }

  main#content {
    padding: 18px 20px;
    padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 40px);
  }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); font-size: 14px; }

  .block { margin-bottom: 26px; }
  .block-title { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  .figure-row { display: flex; gap: 14px; margin-bottom: 22px; }
  .figure {
    flex: 1; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px;
  }
  .figure .num { font-family: Georgia, "Iowan Old Style", serif; font-size: 22px; line-height: 1.15; }
  .figure .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .figure .num.danger { color: var(--danger); }
  .figure .num.accent { color: var(--accent); }

  .banner {
    background: var(--accent-soft); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px;
    font-size: 14px; line-height: 1.5;
  }
  .banner.warn { background: var(--warn-soft); border-color: var(--warn); }
  .banner strong { font-weight: 600; }

  .row-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row.tappable { cursor: pointer; }
  .row.tappable:active { background: #FAFAF7; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .row-name { font-size: 15px; font-weight: 600; }
  .row-balance { font-family: Georgia, serif; font-size: 15px; }
  .row-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .bar-track { height: 5px; background: var(--bg); border-radius: 3px; margin-top: 9px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.danger { background: var(--danger); }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
    font-size: 14px; line-height: 1.55; border: 1px dashed var(--line); border-radius: var(--radius);
  }
  .empty-state .add-link { margin-top: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
    font-size: 15px; font-weight: 500; padding: 12px 18px;
    border-radius: var(--radius); cursor: pointer; font-family: inherit;
  }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.full { width: 100%; }
  .btn:active { opacity: 0.82; }
  .btn:disabled { opacity: 0.5; }

  .gate { padding-top: 20px; }
  .gate h2 { font-family: Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 10px; }

  .editor { padding-bottom: 40px; }
  .editor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .editor-head h2 { font-family: Georgia, serif; font-weight: 400; font-size: 20px; margin: 0; }
  .link-btn {
    border: none; background: none; font-family: inherit;
    font-size: 15px; color: var(--muted); cursor: pointer; padding: 6px 2px;
  }
  .form-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
  .editor-actions { margin-top: 24px; }
  .editor-actions + .editor-actions { margin-top: 10px; }

  label { display: block; font-size: 12.5px; color: var(--muted); margin: 14px 0 6px; }
  label.first { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="email"] {
    width: 100%; padding: 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); font-size: 16px; font-family: inherit; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }

  .toggle-pair { display: flex; border: 1px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
  .toggle-opt {
    flex: 1; text-align: center; padding: 11px 8px; font-size: 14px;
    cursor: pointer; background: var(--surface); color: var(--ink);
    border: none; font-family: inherit;
  }
  .toggle-opt.active { background: var(--ink); color: var(--bg); }
  .note { font-size: 12.5px; color: var(--muted); margin: 9px 0 0; line-height: 1.55; }

  .footer-link { text-align: center; margin-top: 34px; }
  .footer-link button {
    background: none; border: none; color: var(--faint);
    font-size: 12.5px; text-decoration: underline; cursor: pointer; font-family: inherit;
  }

  .fab {
    position: fixed;
    bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 18px);
    right: calc(max(0px, (100vw - 460px)) / 2 + 18px);
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--ink); color: var(--bg); font-size: 28px; border: none;
    display: none; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2); z-index: 8; line-height: 0; padding-bottom: 3px;
  }
  .fab.show { display: flex; }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    max-width: 460px; margin: 0 auto; display: flex;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 9;
  }
  .tab-btn {
    flex: 1; border: none; background: transparent; padding: 11px 4px 10px;
    font-family: inherit; font-size: 11.5px; color: var(--faint); cursor: pointer;
  }
  .tab-btn .icon { display: block; font-size: 18px; margin-bottom: 3px; line-height: 1; }
  .tab-btn.active { color: var(--ink); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Ledger</h1>
    <div class="sub" id="todaySub"></div>
    <div class="sync" id="syncBadge"></div>
  </header>
  <main id="content"><div class="loading">Opening your ledger…</div></main>
  <button class="fab" id="fab" data-action="add-card" aria-label="Add a card">+</button>
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="overview"><span class="icon">◐</span>Overview</button>
    <button class="tab-btn" data-tab="cards"><span class="icon">▭</span>Cards</button>
    <button class="tab-btn" data-tab="payoff"><span class="icon">↗</span>Payoff</button>
    <button class="tab-btn" data-tab="budget"><span class="icon">≡</span>Budget</button>
  </nav>
</div>

<script src="config.js"></script>
<script type="module">
  import { boot } from './app.js';

  let createClient = null;
  const cfg = window.LEDGER_CONFIG || {};
  const configured = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !String(cfg.SUPABASE_URL).includes('YOUR_');

  if (configured) {
    try {
      ({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2'));
    } catch (err) {
      console.warn('Supabase library unavailable, running on this device only', err);
    }
  }

  boot(createClient);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
