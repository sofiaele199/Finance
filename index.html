<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="A quiet place to track your cards, what you owe, and when you'll be clear.">
<title>Ledger</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F1F0EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #f3f2ec;
    --surface: #ffffff;
    --surface-soft: #f8faf7;
    --ink: #18221f;
    --muted: #5f6d66;
    --faint: #8e9a93;
    --line: #dde2dc;
    --accent: #3e6656;
    --accent-strong: #2f5447;
    --accent-soft: #e8f1ec;
    --danger: #8c3b2e;
    --warn: #a9762c;
    --warn-soft: #f8eedf;
    --radius: 16px;
    --radius-sm: 12px;
    --tabh: 74px;
    --shadow-sm: 0 1px 2px rgba(8, 18, 14, 0.05), 0 12px 24px rgba(8, 18, 14, 0.06);
    --shadow-md: 0 1px 2px rgba(8, 18, 14, 0.06), 0 18px 36px rgba(8, 18, 14, 0.11);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(1000px 500px at 20% -20%, #ffffff 0%, transparent 60%),
      radial-gradient(1200px 700px at 100% 0%, #e8efe9 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: none;
  }
  #app {
    max-width: 980px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 10px 0 0;
  }

  .topbar {
    margin: 0 12px;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 22px 18px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: linear-gradient(145deg, #ffffff 0%, #f6f9f7 100%);
    box-shadow: var(--shadow-sm);
  }
  .topbar h1 {
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.1px;
    line-height: 1.06;
  }
  .topbar .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .sync {
    display: inline-block;
    margin-top: 10px;
    min-height: 14px;
    font-size: 11.5px;
    color: var(--accent-strong);
    background: #edf3ef;
    border: 1px solid #dce8e1;
    border-radius: 999px;
    padding: 4px 10px;
  }
  .sync.warn { color: var(--warn); }

  main#content {
    padding: 16px 12px;
    padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 46px);
  }
  .loading {
    padding: 70px 0;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .block {
    margin-bottom: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .block-title {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .stack { display: flex; flex-direction: column; gap: 10px; }

  .figure-row {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px;
  }
  .figure {
    min-width: 0;
    background: linear-gradient(145deg, var(--surface) 0%, var(--surface-soft) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-sm);
  }
  .figure .num {
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .figure .label { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.35; }
  .figure .num.danger { color: var(--danger); }
  .figure .num.accent { color: var(--accent); }

  .banner {
    background: linear-gradient(145deg, var(--accent-soft) 0%, #f0f6f2 100%);
    border: 1px solid #d4e4da;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.5;
  }
  .banner.warn { background: var(--warn-soft); border-color: var(--warn); }
  .banner strong { font-weight: 600; }

  .row-list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .row {
    padding: 14px 14px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .row:last-child { border-bottom: none; }
  .row.tappable { cursor: pointer; transition: background-color 0.18s ease; }
  .row.tappable:hover { background: #f7fbf8; }
  .row.tappable:active { background: #edf5f0; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .row-name { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .row-balance {
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .row-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .bar-track { height: 6px; background: #ecf1ed; border-radius: 999px; margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, #63927d 100%); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.danger { background: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 38px 20px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    border: 1px dashed #cad5ce;
    border-radius: var(--radius);
    background: #f8fbf9;
  }
  .empty-state .add-link { margin-top: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--accent-strong);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #f7fbf9;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.2s ease;
    box-shadow: 0 6px 14px rgba(47, 84, 71, 0.22);
  }
  .btn.secondary {
    background: #fff;
    color: var(--ink);
    border-color: #cfd9d2;
    box-shadow: none;
  }
  .btn.full { width: 100%; }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); opacity: 0.9; }
  .btn:disabled { opacity: 0.5; }

  .gate {
    padding-top: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 18px;
  }
  .gate h2 {
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 10px;
  }

  .editor {
    padding-bottom: 40px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 18px;
  }
  .editor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .editor-head h2 {
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
  }
  .link-btn {
    border: none; background: none; font-family: inherit;
    font-size: 14px; color: var(--muted); cursor: pointer; padding: 6px 2px; font-weight: 600;
  }
  .form-error { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
  .editor-actions { margin-top: 24px; }
  .editor-actions + .editor-actions { margin-top: 10px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  label.first { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="email"] {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #d4ddd7;
    border-radius: 12px;
    background: #fbfdfb;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(63, 93, 78, 0.15);
  }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }

  .toggle-pair {
    display: flex;
    border: 1px solid #ccd6cf;
    border-radius: 12px;
    overflow: hidden;
    background: #f8fbf9;
  }
  .toggle-opt {
    flex: 1; text-align: center; padding: 11px 8px; font-size: 14px;
    cursor: pointer; background: transparent; color: var(--ink);
    border: none; font-family: inherit;
  }
  .toggle-opt.active {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #f7fbf9;
  }
  .note { font-size: 12.5px; color: var(--muted); margin: 9px 0 0; line-height: 1.55; }

  .footer-link { text-align: center; margin-top: 34px; }
  .footer-link button {
    background: none; border: none; color: var(--faint);
    font-size: 12.5px; text-decoration: underline; cursor: pointer; font-family: inherit;
  }

  .fab {
    position: fixed;
    bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 18px);
    right: calc(max(0px, (100vw - 980px)) / 2 + 24px);
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
    color: #f7fbf9;
    font-size: 30px;
    border: none;
    display: none; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 12px 22px rgba(46, 83, 69, 0.35);
    z-index: 8;
    line-height: 0;
    padding-bottom: 3px;
  }
  .fab:hover { transform: translateY(-1px); }
  .fab.show { display: flex; }

  .tabbar {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: min(960px, calc(100vw - 24px));
    display: flex;
    background: rgba(255, 255, 255, 0.93);
    border: 1px solid #d5dfd8;
    border-radius: 18px;
    box-shadow: var(--shadow-md);
    padding: 7px 8px calc(7px + env(safe-area-inset-bottom, 0px));
    z-index: 9;
    backdrop-filter: blur(10px);
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 12px;
    padding: 9px 5px 8px;
    font-family: inherit;
    font-size: 11.5px;
    color: var(--faint);
    cursor: pointer;
    transition: color 0.16s ease, background-color 0.16s ease;
  }
  .tab-btn .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    margin: 0 auto 4px;
    border-radius: 10px;
    font-size: 16px;
    line-height: 1;
    background: transparent;
  }
  .tab-btn.active {
    color: var(--ink);
    font-weight: 700;
    background: #f0f6f2;
  }
  .tab-btn.active .icon { background: #deebe3; color: var(--accent-strong); }

  @media (max-width: 560px) {
    #app { padding-top: 0; }
    .topbar {
      margin: 0;
      border-left: none;
      border-right: none;
      border-top: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 14px;
    }
    main#content { padding: 14px 16px; }
    .block { padding: 14px; }
    .figure .num { font-size: 26px; }
    .figure-row { gap: 10px; }
    .tabbar {
      bottom: 0;
      width: 100%;
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-bottom: none;
      box-shadow: 0 -10px 25px rgba(9, 21, 16, 0.1);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      backdrop-filter: none;
    }
    .fab { right: 18px; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Ledger</h1>
    <div class="sub" id="todaySub"></div>
    <div class="sync" id="syncBadge"></div>
  </header>
  <main id="content"><div class="loading">Opening your ledger…</div></main>
  <button class="fab" id="fab" data-action="add-card" aria-label="Add a card">+</button>
  <nav class="tabbar" id="tabbar">
    <button class="tab-btn active" data-tab="overview"><span class="icon">⌂</span>Overview</button>
    <button class="tab-btn" data-tab="cards"><span class="icon">◫</span>Cards</button>
    <button class="tab-btn" data-tab="accounts"><span class="icon">◉</span>Accounts</button>
    <button class="tab-btn" data-tab="payoff"><span class="icon">↗</span>Payoff</button>
    <button class="tab-btn" data-tab="budget"><span class="icon">☷</span>Budget</button>
  </nav>
</div>

<script src="config.js"></script>
<script type="module">
  import { boot } from './app.js';

  let createClient = null;
  const cfg = window.LEDGER_CONFIG || {};
  const configured = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !String(cfg.SUPABASE_URL).includes('YOUR_');

  if (configured) {
    try {
      ({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2'));
    } catch (err) {
      console.warn('Supabase library unavailable, running on this device only', err);
    }
  }

  boot(createClient);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
